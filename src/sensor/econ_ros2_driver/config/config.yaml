econ_ros2_driver:
  ros__parameters:    
    # hardware
    device:         "/dev/24cug" # udev name
    hid_device:     "/dev/24cug_hid" # udev hid name
    
    # local or server  (이 파일은 Jetson launch.py 가 읽음 → jetson 프로파일)
    fastdds_xml:    "fastdds_unicast_jetson.xml" # fastdds_unicast_pc.xml | fastdds_unicast_jetson.xml | fastdds_loopback.xml
    localhost_only:  false     # ROS_LOCALHOST_ONLY
    
    # cam control
    exposure_us:    10000    # 10 ms
    afl_mode:       0        # Auto Frame Length OFF : 0, off | 1, on
    restore_master: false    # shutdown 시 MASTER 복귀 안 함
    resolution:     "wuxga" # sd | hd | fhd | wuxga
    
    # ros2 topic 
    compressed:     true #  true | false
    topic_name:     "/camera/image/compressed" # if compressed, "/camera/image/compressed" 
    frame_id:       "camera_init"
    backend:        "gstreamer" # gstreamer | opencv
    
